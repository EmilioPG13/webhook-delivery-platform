spring:
  application:
    name: webhooks
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/webhooks}
    username: ${DATABASE_USER:webhooks}
    password: ${DATABASE_PASSWORD:webhooks}
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health,info

webhooks:
  admin:
    # Empty disables /admin/**: no token, no operator access.
    token: ${WEBHOOKS_ADMIN_TOKEN:}
  secrets:
    # Base64 of 32 random bytes. Required: the app refuses to start without it.
    master-key: ${WEBHOOKS_MASTER_KEY:}
    key-version: 1
  endpoints:
    allow-insecure-http: false
  worker:
    dispatch-interval: 1s
    dispatch-batch-size: 100
    reaper-interval: 30s
    # A delivery stuck in 'enqueued' longer than this goes back to 'pending'.
    stuck-after: 2m
    # Must outlast the delivery timeout and stay below the queue's visibility timeout.
    lease: 45s
    consumers: 2
    max-concurrent-deliveries: 50
    connect-timeout: 5s
    delivery-timeout: 15s
  queue:
    name: webhook-deliveries
    region: ${AWS_REGION:us-east-1}
    # Empty means real AWS. Local runs point it at ElasticMQ (see the dev profile).
    endpoint: ${SQS_ENDPOINT:}
    # In AWS the queues come from Terraform; only local runs and tests create them.
    create-if-missing: false
    visibility-timeout: 60s
    max-receive-count: 5
