spring:
  application:
    name: webhooks
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/webhooks}
    username: ${DATABASE_USER:webhooks}
    password: ${DATABASE_PASSWORD:webhooks}
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Per shutdown phase, and the worker's consumers stop in one: it must outlast their 30 s grace for running
    # deliveries. A pod's terminationGracePeriodSeconds has to outlast this one in turn.
    timeout-per-shutdown-phase: 45s
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  # On SIGTERM stop accepting requests and let the ones in flight finish, instead of cutting them.
  shutdown: graceful

management:
  endpoint:
    health:
      # Serves /actuator/health/liveness and /readiness whatever the platform. Kubernetes enables them on its own,
      # but the dev profile and the tests run elsewhere.
      probes:
        enabled: true
      group:
        # Ready means able to serve: the process is up and the database answers. Liveness stays free of the
        # database on purpose, or a database outage would have Kubernetes restart every pod for nothing.
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        # prometheus answers only to the operator token (see SecurityConfig).
        include: health,info,prometheus
  metrics:
    distribution:
      # Fixed buckets instead of a full percentile histogram: enough to read p95 in Grafana, a fraction of the series.
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms

webhooks:
  admin:
    # Empty disables /admin/**: no token, no operator access.
    token: ${WEBHOOKS_ADMIN_TOKEN:}
  secrets:
    # Base64 of 32 random bytes. Required: the app refuses to start without it.
    master-key: ${WEBHOOKS_MASTER_KEY:}
    # Name or ARN of an AWS Secrets Manager secret holding that same value. Set it instead of master-key, never
    # both (see MasterKeyFromSecretsManager).
    master-key-secret-id: ${WEBHOOKS_MASTER_KEY_SECRET_ID:}
    key-version: 1
  endpoints:
    allow-insecure-http: false
    # Turns the SSRF guard off. For local development and tests only.
    allow-private-destinations: false
  worker:
    dispatch-interval: 1s
    dispatch-batch-size: 100
    reaper-interval: 30s
    # A delivery stuck in 'enqueued' longer than this goes back to 'pending'.
    stuck-after: 2m
    # Must outlast the delivery timeout and stay below the queue's visibility timeout.
    lease: 45s
    consumers: 2
    max-concurrent-deliveries: 50
    # Of those 50, how many may go to the same endpoint. A slow endpoint then cannot take every slot.
    max-concurrent-per-endpoint: 5
    # false = a fixed pool of platform threads instead; only there to compare the two under load.
    virtual-threads: true
    defer-delay: 2s
    connect-timeout: 5s
    delivery-timeout: 15s
  rate-limit:
    # postgres: one bucket per tenant shared by every API instance. memory: per-instance, no database round trip.
    store: postgres
  breaker:
    failure-threshold: 50
    failing-for: 24h
    # Pending deliveries of an endpoint that stays switched off this long are cancelled.
    cancel-after: 7d
    sweep-interval: 1h
  retention:
    # Events, deliveries and attempts older than this are deleted. An Idempotency-Key goes with its event.
    period: 30d
    interval: 1h
    batch-size: 1000
  queue:
    name: webhook-deliveries
    region: ${AWS_REGION:us-east-1}
    # Empty means real AWS. Local runs point it at ElasticMQ (see the dev profile).
    endpoint: ${SQS_ENDPOINT:}
    # In AWS the queues come from Terraform; only local runs and tests create them.
    create-if-missing: false
    visibility-timeout: 60s
    max-receive-count: 5
