name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The tests start PostgreSQL 18 with Testcontainers; the runner already has Docker.
      - run: ./mvnw -B verify

  # Builds the image without publishing it, so a broken Dockerfile fails the pull request and not the first deploy.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag webhooks:ci .

  # Formatting and syntax only. No credentials, no backend: this job cannot touch AWS.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        directory: [infra/bootstrap, infra/demo]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Publishes the image to GitHub Container Registry from main, authenticated with the workflow's own token: no
  # secrets to store. (ECR with OIDC was the first plan; the AWS project forbids the OIDC provider, see infra/README.md.)
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, image, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase and the repository owner is not. The sha tag never moves; latest follows main.
      - run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$image:${{ github.sha }}" --tag "$image:latest" .
          docker push --all-tags "$image"
